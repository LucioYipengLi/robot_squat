<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upper Mobile 失败样本</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101722;color:#dbe6f5;font:14px system-ui,sans-serif}header{padding:16px 22px;background:#172233;border-bottom:1px solid #33415b}h1{font-size:19px;margin:0 0 6px}#run{color:#a8bad1}main{display:grid;grid-template-columns:minmax(480px,1fr) 340px;gap:14px;padding:14px}section,aside{background:#172233;border:1px solid #33415b;border-radius:8px;padding:12px}select,button,input{font:inherit}select,button{color:#dbe6f5;background:#22334b;border:1px solid #4a5e7d;border-radius:4px;padding:6px;max-width:100%}button{cursor:pointer}button:hover{background:#304967}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}.stage{height:540px;position:relative;background:#111b29}canvas{width:100%;height:100%;display:block}#overlay{position:absolute;inset:0;touch-action:none}#timeline{flex:1;min-width:180px}#chart{height:180px;background:#111b29}#details{font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}#contactTable{font-size:12px;width:100%;border-collapse:collapse}td,th{text-align:left;padding:6px;border-bottom:1px solid #33415b}td:first-child{overflow-wrap:anywhere}small{color:#a8bad1}.error{color:#ffab97}#state{color:#93cdfa}label{display:inline-flex;gap:6px;align-items:center}aside{max-height:960px;overflow:auto}@media(max-width:900px){main{display:block}aside{margin-top:12px}.stage{height:430px}}
[hidden]{display:none!important}
</style>
<header><h1 id="title">Upper Mobile · 失败样本回放</h1><div id="run">正在读取本地记录…</div></header>
<main><section>
<div class="row"><label>类别 <select id="category"><option value="">全部</option><option>planar</option><option>regular</option><option>height_shifted</option></select></label><label>终止项 <select id="reason"><option value="">全部</option></select></label><button id="refresh">刷新样本</button></div>
<div class="row"><button id="prev">上一例</button><select id="samples" style="flex:1"></select><button id="next">下一例</button></div>
<div class="stage"><canvas id="scene"></canvas><canvas id="overlay"></canvas></div>
<small>拖动旋转 · 滚轮缩放 · 蓝色左侧、橙色右侧 · 绿色腕部目标<span id="contactLegend"> · 红色接触点与法向力</span>。画面直接播放记录的刚体姿态。</small>
<div class="row"><button id="play">播放</button><button id="back">−1帧</button><button id="forward">+1帧</button><input id="timeline" type="range" min="0" max="0" value="0"><select id="speed"><option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>
<div class="row"><span id="state">请选择样本</span><label><span id="channelLabel">力通道</span> <select id="partner"><option value="-1">躯干净法向力</option></select></label></div>
<canvas id="chart"></canvas><small id="chartHint">力曲线保留物理子步采样；虚线为原1 N参考线。接触时长在失败重置处截断，表示已观察到的部分。</small>
</section><aside><h3>样本信息</h3><div id="details"></div><div id="contactInfo"><h3>接触对象（整个片段）</h3><table id="contactTable"><thead><tr><th>对象</th><th>峰值 N</th><th>&gt;1N 秒</th></tr></thead><tbody></tbody></table><p><small>图中的躯干净力可能包含多个方向的抵消；逐对象通道可用于检查具体部位。torso_link同时包含躯干和头部。接触点是当前物理帧内该对象的平均接触位置。</small></p></div></aside></main>
<script>
'use strict';
const $=id=>document.getElementById(id), norm=v=>Math.hypot(...v), add=(a,b)=>a.map((x,i)=>x+b[i]), sub=(a,b)=>a.map((x,i)=>x-b[i]), scale=(a,s)=>a.map(x=>x*s), dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0), cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]], unit=a=>scale(a,1/(norm(a)||1));
let index,geometry,trace,selected,filtered=[],frame=0,playing=false,last=0,elapsed=0,azimuth=-0.9,elevation=0.3,distance=3.5,center=[0,0,0.7],vp,meshes=[];
async function api(path){const r=await fetch(path);if(!r.ok)throw Error(await r.text());return r.json();}
function option(select,value,text){const e=document.createElement('option');e.value=value;e.textContent=text;select.append(e);}
function mul(a,b){let c=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++)for(let k=0;k<4;k++)c[j*4+i]+=a[k*4+i]*b[j*4+k];return c;}
function camera(){const eye=add(center,[distance*Math.cos(elevation)*Math.cos(azimuth),distance*Math.cos(elevation)*Math.sin(azimuth),distance*Math.sin(elevation)]),z=unit(sub(eye,center)),x=unit(cross([0,0,1],z)),y=cross(z,x),v=new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]),f=1/Math.tan(Math.PI/8),a=$('scene').width/$('scene').height,n=.02,r=200,p=new Float32Array([f/a,0,0,0,0,f,0,0,0,0,(r+n)/(n-r),-1,0,0,2*r*n/(n-r),0]);return mul(p,v);}
function model(p){const [x,y,z,w]=p.slice(3),xx=x*x,yy=y*y,zz=z*z;return new Float32Array([1-2*(yy+zz),2*(x*y+w*z),2*(x*z-w*y),0,2*(x*y-w*z),1-2*(xx+zz),2*(y*z+w*x),0,2*(x*z+w*y),2*(y*z-w*x),1-2*(xx+yy),0,...p.slice(0,3),1]);}
const gl=$('scene').getContext('webgl2',{antialias:true});
if(!gl)$('run').textContent='浏览器需要开启 WebGL 2 才能显示三维模型。';
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
let program,loc={};
function initGL(){program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,'#version 300 es\nin vec3 p;in vec3 n;uniform mat4 vp;uniform mat4 m;out vec3 normal;void main(){gl_Position=vp*m*vec4(p,1.);normal=mat3(m)*n;}'));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,'#version 300 es\nprecision mediump float;in vec3 normal;uniform vec3 color;out vec4 outColor;void main(){float light=.4+.6*abs(dot(normalize(normal),normalize(vec3(.4,-.6,1.))));outColor=vec4(color*light,1.);}'));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));for(const k of ['vp','m','color'])loc[k]=gl.getUniformLocation(program,k);gl.enable(gl.DEPTH_TEST);gl.useProgram(program);}
function meshBuffer(m){const positions=m.vertices.flat(),ids=m.triangles.flat(),normals=new Float32Array(positions.length);for(let t=0;t<ids.length;t+=3){const a=ids[t],b=ids[t+1],c=ids[t+2],v=cross(sub(m.vertices[b],m.vertices[a]),sub(m.vertices[c],m.vertices[a]));for(const id of [a,b,c])for(let k=0;k<3;k++)normals[id*3+k]+=v[k];}const vao=gl.createVertexArray();gl.bindVertexArray(vao);for(const [name,data]of [['p',new Float32Array(positions)],['n',normals]]){const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);const a=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,0,0);}const buf=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,buf);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(ids),gl.STATIC_DRAW);return {...m,vao,count:ids.length};}
function resize(c){const w=Math.round(c.clientWidth*devicePixelRatio),h=Math.round(c.clientHeight*devicePixelRatio);if(c.width!==w||c.height!==h){c.width=w;c.height=h;}}
function project(p){const a=[...p,1],q=[0,0,0,0];for(let i=0;i<4;i++)for(let j=0;j<4;j++)q[i]+=vp[j*4+i]*a[j];return q[3]>0?[(q[0]/q[3]+1)*$('overlay').width/2,(1-q[1]/q[3])*$('overlay').height/2]:null;}
function line(ctx,a,b,color,width=2){a=project(a);b=project(b);if(!a||!b)return;ctx.strokeStyle=color;ctx.lineWidth=width*devicePixelRatio;ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();}
function point(ctx,p,color,size=5,label=''){const a=project(p);if(!a)return;ctx.fillStyle=color;ctx.beginPath();ctx.arc(...a,size*devicePixelRatio,0,Math.PI*2);ctx.fill();if(label){ctx.font=`${12*devicePixelRatio}px sans-serif`;ctx.fillText(label,a[0]+8*devicePixelRatio,a[1]-5*devicePixelRatio);}}
function draw(){for(const id of ['scene','overlay','chart'])resize($(id));if(!gl)return;vp=camera();gl.viewport(0,0,$('scene').width,$('scene').height);gl.clearColor(.065,.105,.16,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);const ctx=$('overlay').getContext('2d');ctx.clearRect(0,0,$('overlay').width,$('overlay').height);for(let i=-6;i<=6;i++){line(ctx,[i,-6,0],[i,6,0],'#35445a',.5);line(ctx,[-6,i,0],[6,i,0],'#35445a',.5);}if(!trace)return;const poses=trace.body_pose[frame];gl.useProgram(program);gl.uniformMatrix4fv(loc.vp,false,vp);for(const m of meshes){gl.bindVertexArray(m.vao);gl.uniformMatrix4fv(loc.m,false,model(poses[m.body]));gl.uniform3fv(loc.color,m.color);gl.drawElements(gl.TRIANGLES,m.count,gl.UNSIGNED_INT,0);}if(!meshes.length)for(const [a,b]of geometry.edges)line(ctx,poses[a].slice(0,3),poses[b].slice(0,3),'#8ab5df',4);const mode=selected.arm_mode;for(let i=0;i<2;i++)if(mode===2||mode===i)point(ctx,trace.goal_pose[frame][i].slice(0,3),'#79efa9',5,i===0?'L goal':'R goal');for(let i=0;i<(index.run.partners?.length||0);i++){const f=trace.pair_force[frame].at(-1)[i],p=trace.contact_pos[frame][i],magnitude=norm(f);if(magnitude<.05||!p.every(Number.isFinite))continue;point(ctx,p,'#ff756a',4,index.run.partners[i]);const end=add(p,scale(unit(f),Math.min(.5,magnitude*.015)));line(ctx,p,end,'#ff756a',3);point(ctx,end,'#ff756a',2);}const time=trace.time[frame],phase=time>=(selected.evaluation_start_s??selected.evaluation_start_step*index.run.control_dt)?'评价/保持':'执行';$('state').textContent=`t=${time.toFixed(3)} s · ${phase} · 帧 ${frame+1}/${trace.time.length}`;drawChart();}
function drawChart(){const c=$('chart'),ctx=c.getContext('2d'),d=devicePixelRatio,w=c.width,h=c.height,L=48*d,R=16*d,T=20*d,B=30*d;ctx.clearRect(0,0,w,h);if(!trace)return;if(isQ()){drawQChart(c,ctx);return;}const channel=Number($('partner').value),dt=index.run.physics_dt,values=[],times=[];for(let i=0;i<trace.time.length;i++)for(let s=0;s<index.run.physics_substeps;s++){times.push(trace.time[i]-(index.run.physics_substeps-1-s)*dt);values.push(norm(channel<0?trace.net_force[i][s]:trace.pair_force[i][s][channel]));}const max=Math.max(1.2,...values)*1.1,minT=times[0],maxT=Math.max(times.at(-1),minT+.001),x=t=>L+(t-minT)/(maxT-minT)*(w-L-R),y=f=>h-B-f/max*(h-T-B);ctx.font=`${11*d}px sans-serif`;ctx.fillStyle='#a8bad1';ctx.fillText(`${max.toFixed(1)} N`,2*d,T);ctx.fillText('0',25*d,h-B);ctx.fillText(minT.toFixed(2)+' s',L,h-7*d);ctx.fillText(maxT.toFixed(2)+' s',w-65*d,h-7*d);ctx.strokeStyle='#576b89';ctx.setLineDash([5*d,4*d]);ctx.beginPath();ctx.moveTo(L,y(1));ctx.lineTo(w-R,y(1));ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#f3ad63';ctx.lineWidth=1.5*d;ctx.beginPath();values.forEach((v,i)=>i?ctx.lineTo(x(times[i]),y(v)):ctx.moveTo(x(times[i]),y(v)));ctx.stroke();ctx.strokeStyle='#82d2ff';ctx.beginPath();ctx.moveTo(x(trace.time[frame]),T);ctx.lineTo(x(trace.time[frame]),h-B);ctx.stroke();}
const isQ=()=>index?.run.archive_kind==='upper_q_eval';
const qChannels=[
  ['wrist_left_error_mm','?????? (mm)'],['wrist_right_error_mm','?????? (mm)'],
  ['wrist_left_speed_rms_mps','???? RMS (m/s)'],['wrist_right_speed_rms_mps','???? RMS (m/s)'],
  ['wrist_both_q_actual','???? Q'],['wrist_both_q_target','???? Q'],
  ['wrist_both_q_actual_coverage','???? Q ???'],['wrist_both_q_target_coverage','???? Q ???']
];
function drawQChart(c,ctx){
  const key=$('partner').value,windows=selected.timeline||[],d=devicePixelRatio,L=50*d,R=16*d,T=22*d,B=24*d;
  const lastTime=trace.time.at(-1), duration=Math.max(lastTime,.001);
  const values=windows.map(w=>w[key]).filter(Number.isFinite);
  const max=key.includes('_q_')?1:Math.max(.01,...values)*1.1;
  const x=t=>L+t/duration*(c.width-L-R),y=v=>c.height-B-v/max*(c.height-T-B);
  ctx.font=`${11*d}px sans-serif`;ctx.fillStyle='#a8bad1';
  ctx.fillText(max.toFixed(2),2*d,T);ctx.fillText('0',24*d,c.height-B);
  ctx.fillText(duration.toFixed(1)+' s',c.width-65*d,c.height-5*d);
  ctx.strokeStyle='#f3ad63';ctx.lineWidth=2*d;
  for(const w of windows){if(!Number.isFinite(w[key]))continue;ctx.beginPath();ctx.moveTo(x(w.start_s),y(w[key]));ctx.lineTo(x(Math.min(w.end_s,lastTime)),y(w[key]));ctx.stroke();}
  ctx.strokeStyle='#82d2ff';ctx.beginPath();ctx.moveTo(x(trace.time[frame]),T);ctx.lineTo(x(trace.time[frame]),c.height-B);ctx.stroke();
}
async function refresh(){index=await api('/api/index');
  if(isQ()){
    $('title').textContent='Upper Mobile ? Q ????';
    $('run').textContent=`Level ${index.run.level} ? ${index.summary.completed_episodes} ?? ? ${index.samples.length} ???`;
    $('contactLegend').hidden=true;$('contactInfo').hidden=true;$('category').parentElement.hidden=true;$('reason').parentElement.hidden=true;
    $('channelLabel').textContent='????';$('chartHint').textContent='? 2 ????????????????????????????';
    filter();return;
  }
$('run').textContent=`${index.run.checkpoint} · level ${index.run.level} · ${index.run.policy_output} · 已完成 ${index.summary.completed_episodes} 回合 / 保存 ${index.samples.length} 例失败`;const current=$('reason').value;$('reason').replaceChildren();option($('reason'),'','全部');for(const r of [...new Set(index.samples.flatMap(s=>s.reasons))])option($('reason'),r,r);$('reason').value=current;filter();}
function filter(){if(isQ()){
  filtered=index.samples;$('samples').replaceChildren();
  for(const s of filtered)option($('samples'),s.sample_id,`${s.checkpoint} ? ${s.case_id} ? ${s.policy_output}`);
  if(filtered.length)load(filtered[0].sample_id).catch(fail);
  return;
}filtered=index.samples.filter(s=>(!$('category').value||s.category===$('category').value)&&(!$('reason').value||s.reasons.includes($('reason').value)));$('samples').replaceChildren();for(const s of filtered)option($('samples'),s.sample_id,`${s.sample_id} · ${s.category} · ${['左手','右手','双手'][s.arm_mode]} · ${s.reasons.join(', ')} · ${s.contacts.peak_net_normal_force_n.toFixed(2)} N`);if(filtered.length)load(filtered[0].sample_id);else{$('state').textContent='当前筛选下没有失败样本';trace=null;draw();}}
let loadVersion=0;
async function load(id){const version=++loadVersion;playing=false;$('play').textContent='播放';selected=filtered.find(s=>s.sample_id===id);const value=await api('/api/sample/'+id);if(version!==loadVersion)return;trace=value;frame=0;elapsed=0;$('timeline').max=trace.time.length-1;$('timeline').value=0;
if(isQ()){
  $('details').textContent=JSON.stringify({checkpoint:selected.checkpoint,case_id:selected.case_id,
    policy_output:selected.policy_output,elapsed_s:selected.elapsed_s,failed:selected.failed,
    terminal_window_steady:selected.wrists_steady,goals_env_xyzw:selected.goal_pose_env_xyzw},null,2);
  const current=$('partner').value;$('partner').replaceChildren();
  for(const [value,label] of qChannels)option($('partner'),value,label);
  if(qChannels.some(([key])=>key===current))$('partner').value=current;
  center=trace.body_pose[0][Math.max(0,geometry.body_names.indexOf('pelvis'))].slice(0,3);
  draw();return;
}
$('details').textContent=JSON.stringify({sample:selected.sample_id,category:selected.category,arms:['left','right','both'][selected.arm_mode],reasons:selected.reasons,level:selected.level,elapsed_s:selected.elapsed_s,clip_start_s:selected.clip_start_s,phase:selected.phase,planar_distance_m:selected.planar_distance_m,planar_heading_rad:selected.planar_heading_rad,peak_unattributed_force_n:selected.contacts.peak_unattributed_normal_force_n},null,2);$('partner').replaceChildren();option($('partner'),'-1','躯干净法向力');index.run.partners.forEach((p,i)=>option($('partner'),i,p));const body=$('contactTable').querySelector('tbody');body.replaceChildren();for(const row of selected.contacts.partners.filter(p=>p.peak_normal_force_n>.01)){const tr=document.createElement('tr');for(const text of [row.partner,row.peak_normal_force_n.toFixed(3),row.time_above_1n_s.toFixed(4)]){const td=document.createElement('td');td.textContent=text;tr.append(td);}body.append(tr);}center=trace.body_pose[0][geometry.body_names.indexOf('pelvis')>=0?geometry.body_names.indexOf('pelvis'):0].slice(0,3);draw();}
function move(delta){frame=Math.max(0,Math.min((trace?.time.length||1)-1,frame+delta));$('timeline').value=frame;draw();}
function sampleMove(delta){const i=filtered.findIndex(s=>s.sample_id===$('samples').value),s=filtered[(i+delta+filtered.length)%filtered.length];if(s){$('samples').value=s.sample_id;load(s.sample_id).catch(fail);}}
function fail(e){$('run').textContent=String(e);$('run').className='error';}
$('samples').onchange=()=>load($('samples').value).catch(fail);$('category').onchange=filter;$('reason').onchange=filter;$('refresh').onclick=()=>refresh().catch(fail);$('prev').onclick=()=>sampleMove(-1);$('next').onclick=()=>sampleMove(1);$('timeline').oninput=()=>{frame=+$('timeline').value;elapsed=0;draw();};$('partner').onchange=draw;$('back').onclick=()=>move(-1);$('forward').onclick=()=>move(1);$('play').onclick=()=>{if(!trace)return;playing=!playing;elapsed=0;$('play').textContent=playing?'暂停':'播放';};let drag=null;$('overlay').onpointerdown=e=>{drag=[e.clientX,e.clientY];$('overlay').setPointerCapture(e.pointerId);};$('overlay').onpointerup=()=>drag=null;$('overlay').onpointermove=e=>{if(drag){azimuth-=(e.clientX-drag[0])*.008;elevation=Math.max(-.1,Math.min(1.45,elevation+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw();}};$('overlay').onwheel=e=>{e.preventDefault();distance=Math.max(.5,Math.min(30,distance*Math.exp(e.deltaY*.001)));draw();};window.onresize=draw;
function animate(now){if(playing&&trace){elapsed+=(now-last)/1000*Number($('speed').value);while(elapsed>=index.run.control_dt){elapsed-=index.run.control_dt;if(frame>=trace.time.length-1){playing=false;$('play').textContent='播放';break;}move(1);}}last=now;requestAnimationFrame(animate);}
async function start(){if(!gl)return;initGL();geometry=await api('/api/geometry');meshes=geometry.meshes.map(meshBuffer);await refresh();draw();requestAnimationFrame(animate);}
start().catch(fail);
</script>
</html>
